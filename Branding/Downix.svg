<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- macOS Icon Outer Drop Shadow -->
    <filter id="mac-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.45" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.25" />
    </filter>

    <!-- Inner Glow & Bevel Filter for metallic parts -->
    <filter id="metallic-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#00FFA3" flood-opacity="0.35" />
    </filter>

    <!-- Background Base Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#142B24" />
      <stop offset="45%" stop-color="#0A1814" />
      <stop offset="100%" stop-color="#040A08" />
    </linearGradient>

    <!-- Bezel Gradient (Titanium Gold / Champagne Edge) -->
    <linearGradient id="bezel-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E7C4" />
      <stop offset="25%" stop-color="#9E8A58" />
      <stop offset="50%" stop-color="#D8C596" />
      <stop offset="75%" stop-color="#6B5932" />
      <stop offset="100%" stop-color="#BCA36B" />
    </linearGradient>

    <!-- Inner Radial Vignette -->
    <radialGradient id="inner-radial" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#103E31" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#061A14" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#020806" stop-opacity="1" />
    </radialGradient>

    <!-- Emerald Teal Metallic Gradients -->
    <linearGradient id="emerald-main" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2EF2B3" />
      <stop offset="35%" stop-color="#10B981" />
      <stop offset="70%" stop-color="#057A55" />
      <stop offset="100%" stop-color="#034E36" />
    </linearGradient>

    <linearGradient id="emerald-light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7EFAD0" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#046C4E" />
    </linearGradient>

    <linearGradient id="gold-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2B2" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#896614" />
    </linearGradient>

    <!-- Downward Speed Stream / Arrow Core -->
    <linearGradient id="arrow-core" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="40%" stop-color="#2EF2B3" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <!-- Clip Path for macOS Squircle Base -->
    <clipPath id="squircle-clip">
      <rect x="32" y="32" width="448" height="448" rx="104" ry="104" />
    </clipPath>
  </defs>

  <!-- macOS App Icon Base -->
  <g filter="url(#mac-shadow)">
    <!-- Outer Metallic Border -->
    <rect x="32" y="32" width="448" height="448" rx="104" ry="104" fill="url(#bezel-grad)" />
    
    <!-- Inner Dark Canvas Screen -->
    <rect x="36" y="36" width="440" height="440" rx="100" ry="100" fill="url(#bg-grad)" />
  </g>

  <!-- Clipped Interior Details -->
  <g clip-path="url(#squircle-clip)">
    <!-- Radial Depth Light -->
    <circle cx="256" cy="230" r="230" fill="url(#inner-radial)" />

    <!-- Subtle IDM Connection Grid Matrix (40% opacity) -->
    <g opacity="0.12" stroke="#10B981" stroke-width="1">
      <circle cx="256" cy="245" r="195" fill="none" stroke-dasharray="3 6" />
      <circle cx="256" cy="245" r="160" fill="none" />
      <circle cx="256" cy="245" r="125" fill="none" stroke-dasharray="2 4" />
      <line x1="256" y1="50" x2="256" y2="440" stroke-dasharray="4 6" />
      <line x1="61" y1="245" x2="451" y2="245" stroke-dasharray="4 6" />
    </g>

    <!-- Concentric Decorative Ring Frame -->
    <circle cx="256" cy="242" r="172" fill="none" stroke="url(#bezel-grad)" stroke-width="3" opacity="0.6" />
    <circle cx="256" cy="242" r="166" fill="none" stroke="#00FFA3" stroke-width="1" opacity="0.25" />

    <!-- CENTER PIECE: THE DOWNDEX BUTTERFLY & PINE DOWNLOAD EMBLEM -->
    <g id="downix-mark" transform="translate(0, -6)">

      <!-- BACKGROUND PINE STRUCTURE (Geometric Evergreen Silhouette) -->
      <g id="pine-tree" opacity="0.95">
        <!-- Top Pine Spear (Apex Arrow) -->
        <polygon points="256,92 284,136 266,136 294,180 256,155 218,180 246,136 228,136" fill="url(#emerald-main)" stroke="url(#gold-accent)" stroke-width="2" />
        
        <!-- Pine Needle Chevron Sprigs (Left & Right Flanks) -->
        <path d="M 235,160 L 195,145 M 230,175 L 180,165 M 225,195 L 175,195 M 225,215 L 185,225" stroke="url(#gold-accent)" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />
        <path d="M 277,160 L 317,145 M 282,175 L 332,165 M 287,195 L 337,195 M 287,215 L 327,225" stroke="url(#gold-accent)" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />
      </g>

      <!-- BUTTERFLY WINGS: SEGMENTED MULTI-THREAD FEATHERING (LEFT SIDE) -->
      <g id="left-wings">
        <!-- Upper Forewing -->
        <path d="M 252,225 C 240,170 180,120 128,135 C 105,142 98,170 115,195 C 135,224 195,250 250,252 Z" fill="url(#emerald-main)" stroke="url(#gold-accent)" stroke-width="2" filter="url(#metallic-glow)" />
        
        <!-- Interior Wing Segments (Multi-thread Sockets) -->
        <path d="M 145,152 C 170,165 210,195 240,230" stroke="url(#emerald-light)" stroke-width="2.5" stroke-linecap="round" fill="none" />
        <path d="M 125,175 C 150,185 195,215 232,242" stroke="url(#emerald-light)" stroke-width="2" stroke-linecap="round" fill="none" />
        <path d="M 132,198 C 160,205 195,228 226,248" stroke="url(#emerald-light)" stroke-width="1.5" stroke-linecap="round" fill="none" />

        <!-- Lower Hindwing (Converts to Downward Dynamics) -->
        <path d="M 248,258 C 215,262 135,275 142,325 C 146,350 178,368 212,335 C 232,315 246,285 250,268 Z" fill="url(#emerald-main)" stroke="url(#gold-accent)" stroke-width="2" />
        <path d="M 160,318 C 185,312 220,295 242,272" stroke="url(#emerald-light)" stroke-width="2" stroke-linecap="round" fill="none" />
      </g>

      <!-- BUTTERFLY WINGS: SEGMENTED MULTI-THREAD FEATHERING (RIGHT SIDE) -->
      <g id="right-wings">
        <!-- Upper Forewing -->
        <path d="M 260,225 C 272,170 332,120 384,135 C 407,142 414,170 397,195 C 377,224 317,250 262,252 Z" fill="url(#emerald-main)" stroke="url(#gold-accent)" stroke-width="2" filter="url(#metallic-glow)" />
        
        <!-- Interior Wing Segments (Multi-thread Sockets) -->
        <path d="M 367,152 C 342,165 302,195 272,230" stroke="url(#emerald-light)" stroke-width="2.5" stroke-linecap="round" fill="none" />
        <path d="M 387,175 C 362,185 317,215 280,242" stroke="url(#emerald-light)" stroke-width="2" stroke-linecap="round" fill="none" />
        <path d="M 380,198 C 352,205 317,228 286,248" stroke="url(#emerald-light)" stroke-width="1.5" stroke-linecap="round" fill="none" />

        <!-- Lower Hindwing (Converts to Downward Dynamics) -->
        <path d="M 264,258 C 297,262 377,275 370,325 C 366,350 334,368 300,335 C 280,315 266,285 262,268 Z" fill="url(#emerald-main)" stroke="url(#gold-accent)" stroke-width="2" />
        <path d="M 352,318 C 327,312 292,295 270,272" stroke="url(#emerald-light)" stroke-width="2" stroke-linecap="round" fill="none" />
      </g>

      <!-- BUTTERFLY BODY & ACCELERATED DOWNLOAD ARROW CORE -->
      <g id="butterfly-body-arrow">
        <!-- Antennae (Curved Fiber Optic Needles) -->
        <path d="M 252,200 Q 235,160 216,168" stroke="url(#gold-accent)" stroke-width="2.5" stroke-linecap="round" fill="none" />
        <circle cx="215" cy="168" r="3.5" fill="#FFF2B2" />
        <path d="M 260,200 Q 277,160 296,168" stroke="url(#gold-accent)" stroke-width="2.5" stroke-linecap="round" fill="none" />
        <circle cx="297" cy="168" r="3.5" fill="#FFF2B2" />

        <!-- Butterfly Thorax & Head (Emerald Jewel Beads) -->
        <ellipse cx="256" cy="208" rx="7" ry="8" fill="url(#gold-accent)" />
        <ellipse cx="256" cy="226" rx="9" ry="14" fill="url(#emerald-light)" stroke="url(#gold-accent)" stroke-width="1.5" />
        <circle cx="256" cy="223" r="3" fill="#FFFFFF" opacity="0.7" />

        <!-- ABDOMEN MORPHS INTO PRECISION ACCELERATED DOWN-ARROW -->
        <g id="download-spear" filter="url(#metallic-glow)">
          <!-- Primary Downward Plunging Arrowhead -->
          <path d="M 256,380 L 210,314 L 238,314 L 238,245 L 274,245 L 274,314 L 302,314 Z" fill="url(#arrow-core)" stroke="url(#gold-accent)" stroke-width="3" stroke-linejoin="round" />
          
          <!-- Inner Core Highlight Streak -->
          <polygon points="256,368 226,322 244,322 244,254 268,254 268,322 286,322" fill="#FFFFFF" opacity="0.4" />
        </g>
      </g>

      <!-- GOLD DATA BURST / SEED DOTS -->
      <g id="sparkle-particles" fill="url(#gold-accent)">
        <circle cx="256" cy="406" r="3" />
        <circle cx="256" cy="420" r="1.5" opacity="0.7" />
        <circle cx="110" cy="148" r="2.5" />
        <circle cx="402" cy="148" r="2.5" />
        <circle cx="88" cy="215" r="2" opacity="0.6" />
        <circle cx="424" cy="215" r="2" opacity="0.6" />
      </g>

    </g>

    <!-- Top Glass Rim Light / Specular Reflection (macOS Polish) -->
    <path d="M 36,136 C 36,78 78,36 136,36 L 376,36 C 434,36 476,78 476,136 C 360,140 152,145 36,136 Z" fill="#FFFFFF" opacity="0.08" />
  </g>
</svg>